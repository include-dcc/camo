# PURL configuration for http://purl.obolibrary.org/obo/camo

idspace: CAMO
base_url: /obo/camo

products:
- camo.owl: https://raw.githubusercontent.com/include-dcc/camo/main/camo.owl
- camo.obo: https://raw.githubusercontent.com/include-dcc/camo/main/camo.obo

term_browser: ontobee
example_terms:
- CAMO_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/include-dcc/camo/v

- prefix: /tracker/
  replacement: https://github.com/include-dcc/camo/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/CAMO?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/include-dcc/camo/main/

